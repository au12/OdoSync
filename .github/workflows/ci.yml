name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Publish a release with this version (e.g. 0.1.0). Leave empty for a plain build."
        required: false
        default: ""

permissions:
  contents: read

# Plain pushes supersede each other; release runs (tags or "Run workflow" with a version)
# get their own group and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.release_version }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && inputs.release_version == '' }}

jobs:
  test:
    name: Unit tests + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Unit tests (ISO-TP / BMW odometer decoding against real F32/F36 captures)
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Android lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Upload test + lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Build APK
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release (version bump on main, v* tag or manual run)
    env:
      KEYSTORE_B64: ${{ secrets.ODOSYNC_KEYSTORE_BASE64 }}
      ODOSYNC_KEYSTORE_PASSWORD: ${{ secrets.ODOSYNC_KEYSTORE_PASSWORD }}
      ODOSYNC_KEY_ALIAS: ${{ secrets.ODOSYNC_KEY_ALIAS }}
      ODOSYNC_VERSION_CODE: ${{ github.run_number }}
      RELEASE_INPUT: ${{ inputs.release_version }}
      # Public fingerprint of the OdoSync release certificate; releases must match it.
      RELEASE_CERT_SHA256: 26721f86047f5adcd8d4fbe444479a9c42e9e7bb88bb9cc435f8fbec62fbd53f
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base=$(grep -E '^odosync.version=' gradle.properties | cut -d= -f2)
          release=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            release=true
          elif [[ -n "$RELEASE_INPUT" ]]; then
            version="${RELEASE_INPUT#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+.][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::release_version must look like 0.1.0 (got '$RELEASE_INPUT')"
              exit 1
            fi
            release=true
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]] \
            && ! gh release view "v$base" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # odosync.version in gradle.properties was bumped and has no release yet: publish it.
            version="$base"
            release=true
          else
            version="${base}-dev.${GITHUB_RUN_NUMBER}"
          fi
          if [[ "$release" == true && "$version" != "$base" ]]; then
            echo "::warning::Releasing $version but gradle.properties has odosync.version=$base"
          fi
          {
            echo "ODOSYNC_VERSION_NAME=$version"
            echo "RELEASE=$release"
            echo "RELEASE_TAG=v$version"
          } >> "$GITHUB_ENV"
          echo "Building $version (versionCode $GITHUB_RUN_NUMBER, release=$release)"

      - name: Release keystore
        run: |
          if [[ -n "$KEYSTORE_B64" ]]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ODOSYNC_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release key"
          elif [[ "$RELEASE" == true ]]; then
            echo "::error::ODOSYNC_KEYSTORE_BASE64 secret missing - refusing to publish a release signed with a throwaway debug key"
            exit 1
          else
            echo "::warning::No release key available (fork PR or secrets not set) - APK is debug-signed"
          fi

      - name: Build release APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Collect + verify APK
        shell: bash
        run: |
          mkdir -p out
          name="OdoSync-${ODOSYNC_VERSION_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "out/$name"
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          # apksigner's wording changed in build-tools 37 ("Signer #1 certificate ..." ->
          # "V2 Signer: certificate ..."), so match on the stable part only.
          certs=$("$bt/apksigner" verify --print-certs "out/$name")
          echo "$certs" | grep -iE "certificate (DN|SHA-256 digest)" || echo "$certs"
          sha=$(echo "$certs" | grep -i "certificate SHA-256 digest" | head -1 | awk '{print $NF}')
          if [[ -z "$sha" ]]; then
            echo "::error::Could not read the signing certificate from apksigner"
            exit 1
          fi
          if [[ "$RELEASE" == true && "$sha" != "$RELEASE_CERT_SHA256" ]]; then
            echo "::error::APK signed with $sha but releases must use the OdoSync key ($RELEASE_CERT_SHA256)"
            exit 1
          fi
          (cd out && sha256sum "$name" | tee "$name.sha256")

      - uses: actions/upload-artifact@v7
        with:
          name: OdoSync-${{ env.ODOSYNC_VERSION_NAME }}
          path: out/
          retention-days: 30

      # On a pushed v* tag this releases that tag. From "Run workflow" with a version it creates
      # the tag at this commit (tags made with GITHUB_TOKEN don't start a second run).
      - name: Publish GitHub release
        if: env.RELEASE == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: OdoSync ${{ env.RELEASE_TAG }}
          files: |
            out/*.apk
            out/*.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
